name: test
on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
jobs:
  fixtures:
    # Pinned rather than ubuntu-latest: the expected output contains samtools-rendered SAM text, and
    # ubuntu-latest moves between images carrying different samtools versions without warning.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install samtools
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools
      - name: Record versions
        run: |
          samtools --version | head -2
          perl --version | sed -n '2p'
      - name: Run fixture suite
        run: test/run_tests.pl --verbose

  genome-fixtures:
    # SNPsplit_genome_preparation touches no alignments, so this job needs gzip and nothing else.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record versions
        run: |
          perl --version | sed -n '2p'
          gzip --version | head -1
      - name: Run genome preparation fixture suite
        run: test/run_genome_tests.pl --verbose
      - name: Re-run under two hash seeds
        # Six outputs are written from Perl hashes and normalised by sorting. Running under fixed,
        # differing seeds keeps that normalisation proven instead of assumed: without it a broken rule
        # would surface as an intermittent failure months later.
        run: |
          for seed in 1 4242; do
            echo "PERL_HASH_SEED=$seed"
            PERL_HASH_SEED=$seed PERL_PERTURB_KEYS=2 test/run_genome_tests.pl
          done
