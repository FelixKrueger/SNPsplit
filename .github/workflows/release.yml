name: release
on:
  push:
    tags:
      - 'rust-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    # One archive per platform, attached to the release. A user who does not want a Rust
    # toolchain should not need one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: rust
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage the classic names
        working-directory: rust
        run: |
          out="snpsplit-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/snpsplit" "$out/"
          # Symlinks rather than copies: the binary dispatches on argv[0], and four copies of
          # the same megabytes in one archive would be silly.
          ln -s snpsplit "$out/SNPsplit"
          ln -s snpsplit "$out/tag2sort"
          ln -s snpsplit "$out/SNPsplit_genome_preparation"
          cp ../LICENSE "$out/" 2>/dev/null || true
          tar czf "$out.tar.gz" "$out"
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: rust/snpsplit-${{ matrix.target }}.tar.gz

  container:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: rust
          file: rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/snpsplit:latest
            ghcr.io/${{ github.repository_owner }}/snpsplit:${{ github.ref_name }}
