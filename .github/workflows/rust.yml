name: rust
on:
  push:
    branches:
      - master
      - dev
      - rust
  pull_request:
    branches:
      - master
      - dev
      - rust

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Record versions
        run: cargo --version && rustc --version
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        # Warnings are failures here on purpose. A port accumulates dead code between
        # phases, and an allow-by-default warning stream is one nobody reads.
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked

  fixtures-rust:
    # The alignment suite against the Rust build. Gated by test/rust_fixtures.txt, which
    # fails both on a listed fixture that breaks and on an unlisted one that starts passing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install samtools
        # Still needed: the runner itself shells out to samtools to normalise output into
        # comparable SAM text. The implementation under test does not.
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools
      - name: Build the Rust implementation
        run: ./rust/build-impl.sh
      - name: Gate
        run: test/bin/run_rust_gate.sh alignment
      - name: Gate at four workers
        # Output is supposed to be identical whatever the worker count. Running the same
        # fixtures against the same expected output at a different count is that claim
        # checked rather than asserted.
        run: test/bin/run_rust_gate.sh alignment 4

  genome-fixtures-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the Rust implementation
        run: ./rust/build-impl.sh
      - name: Gate
        run: test/bin/run_rust_gate.sh genome
      - name: Gate at four workers
        run: test/bin/run_rust_gate.sh genome 4
      - name: Check the output is reproducible
        # The gate cannot catch this: it compares against recorded output, which is the same
        # every run by construction. This compares two runs of the implementation itself.
        run: test/bin/check_reproducible.pl --impl rust/target/impl/SNPsplit_genome_preparation
