[package]
name = "snpsplit"
description = "Allele-specific alignment sorting: tag and split reads by parental genome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://felixkrueger.github.io/SNPsplit"
documentation = "https://felixkrueger.github.io/SNPsplit"
readme = "../../README.md"
keywords = ["bioinformatics", "genomics", "allele-specific", "snp", "bam"]
categories = ["science::bioinformatics::genomics", "command-line-utilities"]
# The tests read the fixtures and the Perl outside this directory, so they stay in the repository.
include = ["src/**/*", "banners/*", "help/*", "examples/**/*", "Cargo.toml", "LICENSE"]

[[bin]]
name = "snpsplit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
flate2.workspace = true
libc.workspace = true
noodles-bam.workspace = true
noodles-bgzf.workspace = true
noodles-sam.workspace = true
rayon.workspace = true
sha2.workspace = true
ureq.workspace = true
tempfile.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
